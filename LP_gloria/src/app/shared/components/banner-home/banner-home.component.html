<div
  class="banner-home"
  style="background: url({{url}}) no-repeat center center ;
  min-height: 90vh;
  min-width: 100%;
  background-size: cover;"
>
  <div class="banner-content">
    <div class="content-left">
      <div>
        <button mat-button>
          <h4>QUERO</h4>
          <h4>CONVERSAR</h4>
        </button>
        <button mat-button>DOE AGORA</button>
      </div>
    </div>
    <div class="content-right">
      <img src="{{ imgHome }}" alt="imgHome" />
      <div>
        <span *ngIf="firstParagraph"
          ><h4
            [ngClass]="voluntaryPage ? 'text-home-voluntary' : 'text-home'"
          >
            {{ firstParagraph }}
          </h4></span
        >
        <span *ngIf="seccondParagraph"
          ><h4
            [ngClass]="voluntaryPage ? 'text-home-voluntary' : 'text-home'"
          >
            {{ seccondParagraph }}
          </h4></span
        >
        <span *ngIf="thirdParagraph"
          ><h4
            [ngClass]="voluntaryPage ? 'text-home-voluntary' : 'text-home'"
          >
            {{ thirdParagraph }}
          </h4></span
        >
      </div>
      <h5 *ngIf="seccondText">{{ seccondText }}</h5>
    </div>
  </div>
</div>
