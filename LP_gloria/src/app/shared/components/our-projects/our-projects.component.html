<h1>Conheça nossos projetos</h1>

<div class="carousel-project">
  <div class="carousel-counter">
    <h2>Pilar 1</h2>
    <img
      src="/assets/img/projects/carousel-counter.svg"
      alt="Círculo do carrossel"
    />
  </div>

  <div class="projects">
    <div *ngFor="let item of projects" class="card">
      <div class="card-img">
        <img src="{{ item.imgProjects }}" alt="Imagem do projeto" />
      </div>
      <div class="card-info">
        <h2>{{ item.title }}</h2>
        <h3>
          {{ item.decription }}
        </h3>
      </div>
    </div>
  </div>
</div>
