<div class="sponsor grid inner-grid">
  <h4 class="cell-4-phone cell-8-tablet cell-12-desktop">
    Conheça nossos Parceiros
  </h4>
  <div class="intern-sponsor no-phone no-tablet cell-12-desktop">
    <div *ngFor="let item of sponsor" class="item-sponsor">
      <img src="{{ item.imgSponsor }}" alt="" />
    </div>
  </div>
  <div class="mobile-sponsor cell-4-phone cell-8-tablet no-desktop">
    <swiper
      [spaceBetween]="30"
      [scrollbar]="{
        hide: true
      }"
      [autoplay]="{
        delay: 2500,
        disableOnInteraction: false
      }"
      class="mySwiper"
    >
      <ng-template swiperSlide *ngFor="let card of sponsor"
        ><div class="item-sponsor">
          <img src="{{ card.imgSponsor }}" alt="" /></div
      ></ng-template>
    </swiper>
  </div>
  <img class="img-left" src="assets/img/sponsor/page/elem junto 1.svg" alt="" />
</div>
