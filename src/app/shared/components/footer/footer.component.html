<footer class="footer">
  <div class="content-footer grid">
    <div class="content-footer-left">
      <img class="img-gloria" src="assets/img/imgFooter.png" alt="" />
      <img class="logo-gloria" src="assets/img/logo.svg" alt="" />
      <h4 class="copy">Copyright 2022</h4>
    </div>
    <div class="content-footer-rigth">
      <h1 class="title">SEJA UM ALIADO A CAUSA</h1>

      <form (submit)="sendEmail($event)" [formGroup]="emailForm">
        <mat-form-field class="form">
          <mat-label>Nome</mat-label>
          <input
            autocomplete="off"
            matInput
            formControlName="name"
            name="name"
            type="name"
          />
        </mat-form-field>
        <mat-form-field class="form">
          <mat-label>E-mail</mat-label>
          <input
            autocomplete="off"
            formControlName="email"
            name="email"
            type="email"
            [email]="true"
            matInput
          />
        </mat-form-field>
      </form>

      <button
        [disabled]="valideButton()"
        (click)="submitEmail()"
        mat-button
        class="btn-footer"
      >
        Cadastre-se
        <app-loader-gloria [loader]="loadingReq"></app-loader-gloria>
      </button>
      <div class="row"></div>
      <div class="intern-content-footer">
        <div class="intern-content-footer-left">
          <h4>Nos siga nas redes</h4>
          <div class="social-media">
            <img src="assets/img/facebook.svg" alt="" />
            <img src="assets/img/instagram.svg" alt="" />
            <img src="assets/img/twitter.svg" alt="" />
          </div>
        </div>
        <div class="intern-content-footer-right">
          <h2>Disque:</h2>
          <h3><span>180</span> - Central de Atendimento à Mulher</h3>
          <h3><span>190</span> - PMDF</h3>
        </div>
      </div>
    </div>
  </div>
</footer>
