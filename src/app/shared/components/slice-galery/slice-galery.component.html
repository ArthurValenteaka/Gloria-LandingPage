<div class="slice-galery grid inner-grid">
  <div class="slice-galery-title cell-4-phone cell-8-tablet cell-12-desktop">
    Galeria de fotos
  </div>
  <div class="slice-galery-intern no-phone no-tablet cell-12-desktop">
    <div class="slice-galery-intern-broke" >
      <swiper
        [spaceBetween]="50"
        [slidesPerView]="3"
        [navigation]="true"
        class="mySwiper"
      >
        <ng-template
          class="item-galery"
          *ngFor="let item of galeryImages"
          swiperSlide
          ><img class="item-galery-image" src="{{ item.imgProject }}" alt="" />
        </ng-template>
      </swiper>
    </div>
  </div>
  <div class="slice-galery-intern cell-4-phone cell-8-tablet no-desktop">
    <swiper
      [spaceBetween]="50"
      [pagination]="{
        dynamicBullets: true
      }"
      class="mySwiper"
    >
      <ng-template
        class="item-galery"
        *ngFor="let item of galeryImages"
        swiperSlide
        ><img class="item-galery-image" src="{{ item.imgProject }}" alt="" />
      </ng-template>
    </swiper>
  </div>
</div>
